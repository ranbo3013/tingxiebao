name: Manual Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Git branch to deploy'
        required: true
        default: 'main'
      keep_data:
        description: 'Keep existing database and uploads'
        required: true
        type: boolean
        default: true

env:
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check server
        working-directory: server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.ECS_DEPLOY_PATH }}"
            GIT_BRANCH="${{ github.event.inputs.target_branch }}"
            KEEP_DATA="${{ github.event.inputs.keep_data }}"

            # Clone or pull the repository
            if [ -d "$DEPLOY_PATH/.git" ]; then
              cd "$DEPLOY_PATH"
              git fetch origin
              git checkout "$GIT_BRANCH"
              git pull origin "$GIT_BRANCH"
            else
              git clone git@github.com:${{ github.repository }}.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
              git checkout "$GIT_BRANCH"
            fi

            cd "$DEPLOY_PATH"

            # Preserve data directory
            BACKUP_DATA=""
            if [ "\$KEEP_DATA" = "true" ] && [ -d "server/data" ]; then
              BACKUP_DATA="/tmp/tingxiebao-data-backup-\$(date +%s)"
              mkdir -p "\$BACKUP_DATA"
              cp -a server/data/* "\$BACKUP_DATA/" 2>/dev/null || true
              echo "Data backed up to \$BACKUP_DATA"
            fi

            # Install dependencies
            npm ci
            cd server && npm ci && cd ..
            cd web && npm ci && cd ..

            # Rebuild
            cd server && npm run build && cd ..
            cd web && npm run build && cd ..

            # Restore data if backup exists
            if [ -n "\$BACKUP_DATA" ] && [ -d "\$BACKUP_DATA" ]; then
              mkdir -p server/data
              cp -a "\$BACKUP_DATA/." server/data/
              rm -rf "\$BACKUP_DATA"
              echo "Data restored successfully"
            fi

            # Restart server
            cd server
            export PATH="$PATH:$(npm root -g)/../.npm-global/bin:/usr/local/bin"
            which pm2 || npm i -g pm2
            pm2 restart tingxiebao-server || pm2 start dist/index.js --name tingxiebao-server
            pm2 save

            echo "Deployment complete!"
