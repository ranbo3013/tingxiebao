name: Build & Deploy to ECS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check server
        working-directory: server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            server/dist/
            server/package.json
            server/package-lock.json
            web/dist/
          retention-days: 1

  deploy:
    name: Deploy to ECS
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: deploy/

      - name: SCP to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT || 22 }}
          source: "deploy/"
          target: ${{ secrets.ECS_DEPLOY_PATH }}/.deploy-tmp
          strip_components: 1

      - name: Install & Restart on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.ECS_DEPLOY_PATH }}"
            TMP="$DEPLOY_PATH/.deploy-tmp"

            echo "=== Deploy from $TMP to $DEPLOY_PATH ==="

            # Backup existing data
            if [ -d "$DEPLOY_PATH/server/data" ]; then
              echo "[backup] saving data"
              cp -a "$DEPLOY_PATH/server/data" /tmp/tingxiebao-data
            fi

            # Move new files in
            echo "[deploy] replacing files"
            rm -rf "$DEPLOY_PATH/server/dist" "$DEPLOY_PATH/web/dist" "$DEPLOY_PATH/server/package.json" "$DEPLOY_PATH/server/package-lock.json"
            mkdir -p "$DEPLOY_PATH/server" "$DEPLOY_PATH/web"

            cp -a "$TMP/server/dist" "$DEPLOY_PATH/server/"
            cp -a "$TMP/server/package.json" "$TMP/server/package-lock.json" "$DEPLOY_PATH/server/"
            cp -a "$TMP/web/dist" "$DEPLOY_PATH/web/"
            rm -rf "$TMP"

            # Restore data
            if [ -d /tmp/tingxiebao-data ]; then
              echo "[restore] data"
              mkdir -p "$DEPLOY_PATH/server/data"
              cp -a /tmp/tingxiebao-data/. "$DEPLOY_PATH/server/data/"
              rm -rf /tmp/tingxiebao-data
            fi

            # Install production deps
            echo "[install] server deps"
            cd "$DEPLOY_PATH/server"
            npm config set registry https://registry.npmmirror.com
            npm ci --omit=dev

            # Restart
            echo "[restart] pm2"
            export PATH="$PATH:/usr/local/bin:$HOME/.npm-global/bin"
            which pm2 || npm i -g pm2
            pm2 restart tingxiebao-server || pm2 start dist/index.js --name tingxiebao-server
            pm2 save

            echo "=== Done ==="
