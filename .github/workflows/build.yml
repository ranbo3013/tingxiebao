name: Build & Deploy to ECS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check server
        working-directory: server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build web frontend
        working-directory: web
        run: npm run build

  deploy:
    name: Deploy to ECS
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.ECS_DEPLOY_PATH }}"

            # Clone or pull (ECS in China, try direct then mirror)
            REPO_URL="https://github.com/${{ github.repository }}.git"
            if [ -d "$DEPLOY_PATH/.git" ]; then
              cd "$DEPLOY_PATH"
              git remote set-url origin "$REPO_URL" 2>/dev/null || true
              git fetch origin --depth=1 || git fetch https://ghproxy.com/$REPO_URL --depth=1
              git checkout main
              git reset --hard origin/main
            else
              git clone --depth=1 "$REPO_URL" "$DEPLOY_PATH" 2>/dev/null || \
              git clone --depth=1 "https://ghproxy.com/$REPO_URL" "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            fi

            # Backup data
            if [ -d "server/data" ]; then
              cp -a server/data /tmp/tingxiebao-data-backup
            fi

            # Install & build
            npm ci
            cd server && npm ci && npm run build && cd ..
            cd web && npm ci && npm run build && cd ..

            # Restore data
            if [ -d /tmp/tingxiebao-data-backup ]; then
              mkdir -p server/data
              cp -a /tmp/tingxiebao-data-backup/. server/data/
              rm -rf /tmp/tingxiebao-data-backup
            fi

            # Restart
            export PATH="$PATH:/usr/local/bin:$HOME/.npm-global/bin"
            which pm2 || npm i -g pm2
            cd server
            pm2 restart tingxiebao-server || pm2 start dist/index.js --name tingxiebao-server
            pm2 save
