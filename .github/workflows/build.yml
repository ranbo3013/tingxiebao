name: Build & Deploy to ECS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check server
        working-directory: server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            server/dist/
            server/package.json
            server/package-lock.json
            web/dist/
          retention-days: 1

  deploy:
    name: Deploy to ECS
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: deploy/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host ecs
            HostName ${{ secrets.ECS_HOST }}
            User ${{ secrets.ECS_USER }}
            Port ${{ secrets.ECS_SSH_PORT || 22 }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "=== SSH config ==="
          cat ~/.ssh/config
          echo "=== Testing connection ==="
          ssh -v ecs "echo SSH_OK" 2>&1 | tail -30

      - name: SCP files
        run: |
          cd deploy
          tar czf ../deploy.tar.gz .
          cd ..
          echo "=== Uploading $(du -h deploy.tar.gz | cut -f1) ==="
          scp -v deploy.tar.gz ecs:/tmp/tingxiebao-deploy.tar.gz 2>&1 | tail -20
          echo "=== SCP done ==="

      - name: Install & Restart
        run: |
          ssh ecs bash << 'REMOTE'
            set -ex
            DEPLOY_PATH="${{ secrets.ECS_DEPLOY_PATH }}"
            mkdir -p "$DEPLOY_PATH"

            echo "=== Extracting ==="
            tar -xzf /tmp/tingxiebao-deploy.tar.gz -C "$DEPLOY_PATH"
            rm /tmp/tingxiebao-deploy.tar.gz
            ls -la "$DEPLOY_PATH/server/dist/" | head -5
            ls -la "$DEPLOY_PATH/web/dist/" | head -5

            echo "[install]"
            cd "$DEPLOY_PATH/server"
            npm config set registry https://registry.npmmirror.com
            npm ci --omit=dev

            echo "[restart]"
            export PATH="$PATH:/usr/local/bin:$HOME/.npm-global/bin"
            which pm2 || npm i -g pm2
            pm2 delete tingxiebao-server 2>/dev/null || true
            pm2 start dist/index.js --name tingxiebao-server
            pm2 save

            echo "=== Done ==="
          REMOTE
